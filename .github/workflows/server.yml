name: Server Docker image (ghcr.io)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

permissions:
  contents: read
  packages: write

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hanwha-monitor-server" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.IMAGE }}:latest
          # a single plain image: no untagged attestation manifests, so the cleanup below can't remove a piece of :latest
          provenance: false
          sbom: false
      # every build leaves the previous image behind untagged; they count against package storage
      - name: Remove old image versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: hanwha-monitor-server
          package-type: container
          min-versions-to-keep: 3
          delete-only-untagged-versions: true
