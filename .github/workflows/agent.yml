name: Windows agent (HanwhaMonitor.exe)

on:
  workflow_dispatch:
    inputs:
      include_ffmpeg:
        description: "Also include ffmpeg.exe (~100 MB, only needed once - it rarely changes)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent.yml"]

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86          # Fwlib32.dll is 32-bit

      - name: Install dependencies
        working-directory: agent
        run: |
          python -c "import struct; assert struct.calcsize('P') == 4, '32-bit Python required'"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        working-directory: agent
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HanwhaMonitor --icon icon.ico --hidden-import pystray._win32 run.py

      # ffmpeg reads the camera's RTSP stream. A separate 64-bit program, so it works even though the app is
      # 32-bit (on 64-bit Windows). Not fatal if the download fails - the app works without the camera.
      - name: Download ffmpeg (camera)
        if: ${{ inputs.include_ffmpeg }}   # manual runs only - saves ~100 MB of artifact storage per build
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          try {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          } catch {
            Write-Host "BtbN build not available ($_), trying gyan.dev"
            Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          }
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName agent\dist\ffmpeg.exe
          & agent\dist\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - uses: actions/upload-artifact@v4
        with:
          name: HanwhaMonitor-exe
          path: |
            agent/dist/HanwhaMonitor.exe
            agent/dist/ffmpeg.exe
          retention-days: 7
          if-no-files-found: warn
