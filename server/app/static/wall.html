<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Wall display - Hanwha Monitor</title>
<link rel="icon" href="logo.png">
<style>
  :root { color-scheme: dark; --bg: #000; --card: #141414; --ink: #f5f5f5; --muted: #9a9a9e; --line: #2a2a2a;
          --accent: #f47521; --run: #30c24a; --standby: #ffb454; --alarm: #ff453a; --off: #6a6a6e; --bar: #3aa0ff; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
         font: 16px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #wall { height: 100%; display: flex; flex-direction: column; gap: 1.2vh; padding: 1.6vh 1.6vw; }
  /* the whole page scales with the window, so it reads from across the shop */
  .state { flex: 0 0 auto; border-radius: 2vh; padding: 2.4vh 2.4vw; display: flex; align-items: center; gap: 2vw;
           background: var(--off); color: #fff; transition: background .3s; }
  .state.running { background: var(--run); color: #04210c; }
  .state.standby { background: var(--standby); color: #2a1a00; }
  .state.alarm   { background: var(--alarm); animation: flash 1.1s steps(1, end) infinite; }
  .state.bar     { background: var(--bar); color: #001a2e; }
  .state.off     { background: #2a2a2e; }
  @keyframes flash { 50% { filter: brightness(.55); } }
  .state .big { font-size: 8vh; font-weight: 900; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
  .state .det { font-size: 2.6vh; font-weight: 600; opacity: .92; margin-top: .6vh; }
  .state .since { font-size: 2.2vh; font-weight: 600; opacity: .8; margin-top: .4vh; font-variant-numeric: tabular-nums; }
  .state .right { margin-left: auto; text-align: right; }
  .state .clock { font-size: 5vh; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .state .date { font-size: 2vh; font-weight: 600; opacity: .8; }
  .overrun { display: inline-block; background: var(--accent); color: #000; font-size: 2.4vh; font-weight: 900;
             padding: .5vh 1.4vw; border-radius: 99px; box-shadow: 0 0 0 .5vh rgba(0,0,0,.2); margin-left: 1.5vw;
             vertical-align: .8vh; }
  .grid { flex: 1 1 auto; display: grid; gap: 1.2vh 1.2vw; grid-template-columns: 1.35fr 1fr 1fr;
          grid-template-rows: 1.5fr 1fr; min-height: 0; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 2vh; padding: 1.8vh 1.6vw;
         display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
  .box .k { color: var(--muted); font-size: 2vh; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  .box .v { font-size: 9vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.02; margin-top: .4vh; }
  .box .v small { font-size: 4vh; font-weight: 700; color: var(--muted); }
  .box .n { color: var(--muted); font-size: 2.2vh; font-weight: 600; margin-top: .6vh; }
  .box.mid .v { font-size: 6vh; }
  .box.wide { grid-column: span 2; }
  .prog { font-size: 4.4vh; font-weight: 900; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .track { height: 2.2vh; border-radius: 99px; background: #262626; margin-top: 1.2vh; overflow: hidden; }
  .track > i { display: block; height: 100%; background: var(--run); border-radius: 99px; transition: width .4s; }
  .alarms { background: #2a0d0b; border-color: #5c1a15; }
  .alarms .a { font-size: 2.8vh; font-weight: 700; margin-top: .5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alarms .a .c { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--alarm); margin-right: .8vw; }
  #cam { object-fit: cover; width: 100%; height: 100%; border-radius: 1.4vh; background: #000; }
  .due { flex: 0 0 auto; display: flex; align-items: center; gap: 1.2vw; border-radius: 1.4vh; padding: 1.2vh 1.6vw;
         font-size: 2.6vh; font-weight: 800; background: #34100d; color: #ff7b6e; border: 1px solid #7d211a; }
  .due.soon { background: #2a1d0a; color: #ffc46b; border-color: #7a5410; }
  .foot { flex: 0 0 auto; display: flex; align-items: center; gap: 1.4vw; color: var(--muted); font-size: 1.9vh; }
  .dot { width: 1.2vh; height: 1.2vh; border-radius: 50%; background: var(--run); display: inline-block; margin-right: .5vw; }
  .dot.bad { background: var(--alarm); }
  .foot a, .foot button { color: var(--muted); background: none; border: 0; font: inherit; cursor: pointer; text-decoration: none; }
  .foot a:hover, .foot button:hover { color: var(--ink); }
  .foot .sp { margin-left: auto; }
  /* a phone or a tall tablet: stack it */
  @media (max-aspect-ratio: 1/1) {
    .grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
    .box.wide { grid-column: span 2; }
    .state .big { font-size: 5.4vh; }
    .box .v { font-size: 7vh; }
  }
</style>
</head>
<body>
<div id="wall">
  <div class="state off" id="state">
    <div>
      <div class="big"><span id="headline">Connecting…</span><span class="overrun" id="overrun" hidden>OVERRUN</span></div>
      <div class="det" id="detail"></div>
      <div class="since" id="since"></div>
    </div>
    <div class="right">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </div>

  <div class="grid">
    <div class="box">
      <div class="k">Parts</div>
      <div class="v"><span id="parts">—</span><small id="required"></small></div>
      <div class="track" id="track" hidden><i id="fill" style="width:0"></i></div>
      <div class="n" id="partsnote"></div>
    </div>
    <div class="box mid">
      <div class="k">Cycle time</div>
      <div class="v" id="cycle">—</div>
      <div class="n" id="cyclenote"></div>
    </div>
    <div class="box mid">
      <div class="k">Next bar change</div>
      <div class="v" id="nextbar">—</div>
      <div class="n" id="barnote"></div>
    </div>
    <div class="box" id="progbox">
      <div class="k">Program</div>
      <div class="prog" id="program">—</div>
      <div class="n" id="prognote"></div>
    </div>
    <div class="box wide" id="infobox">
      <div class="k" id="infok">Finishing</div>
      <div class="v mid" id="infov" style="font-size:6vh">—</div>
      <div class="n" id="infon"></div>
    </div>
    <div class="box wide alarms" id="alarmbox" hidden>
      <div class="k">Active alarms</div>
      <div id="alarmlist"></div>
    </div>
    <div class="box" id="cambox" hidden style="padding:.6vh .5vw"><img id="cam" alt="Camera"></div>
  </div>

  <div class="due" id="due" hidden><span>&#128267;</span><span id="duetext"></span></div>

  <div class="foot">
    <span><span class="dot" id="pcdot"></span><span id="pctext">Monitor PC</span></span>
    <span id="lastseen"></span>
    <span class="sp"></span>
    <button id="camtoggle">Camera</button>
    <button id="full">Full screen</button>
    <a href="./">Dashboard</a>
  </div>
</div>
<script>
const key = new URLSearchParams(location.search).get("key");
const q = key ? `?key=${encodeURIComponent(key)}` : "";
const amp = q ? q + "&" : "?";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = d => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const mmss = s => { if (!s) return "—"; s = Math.round(s); const m = Math.floor(s / 60), x = s % 60;
  return `${m}:${String(x).padStart(2, "0")}`; };
const span = s => { s = Math.round(s || 0); if (s < 60) return s + " sec";
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  if (s >= 86400) return `${Math.floor(s / 86400)} day ${h % 24} hr`;
  return h ? `${h} hr, ${m} min` : `${m} min`; };

let s = null, offset = 0, camOn = localStorage.getItem("wallCam") === "1";

async function poll() {
  try {
    const r = await fetch("api/status" + q);
    if (r.status === 401) return location.replace("login");
    s = await r.json();
    offset = s.server_time ? s.server_time * 1000 - Date.now() : 0;
    $("pcdot").classList.toggle("bad", !s.agent_online);
    $("pctext").textContent = s.agent_online ? "Monitor PC online" : "Monitor PC offline";
    $("lastseen").textContent = s.demo ? "Demo data" : "";
  } catch (e) {
    $("pcdot").classList.add("bad");
    $("pctext").textContent = "Can't reach the server";
  }
  draw();
}

function headlineOf(x) {
  if (x.state === "off") return "OFF";
  if (x.bar_change) return "BAR CHANGE";
  if (x.state === "alarm") return "ALARM";
  if (x.state === "running") return "RUNNING";
  return "STOPPED";
}

function draw() {
  const now = new Date(Date.now() + offset);
  $("clock").textContent = clock(now);
  $("date").textContent = now.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  if (!s) return;
  const kind = s.state === "off" ? "off" : s.bar_change ? "bar" : s.state === "alarm" ? "alarm"
             : s.state === "running" ? "running" : "standby";
  $("state").className = "state " + kind;
  $("headline").textContent = headlineOf(s);
  $("overrun").hidden = !s.over_producing;
  $("detail").textContent = s.state_detail || "";
  $("since").textContent = s.state_since
    ? `Since ${clock(new Date(s.state_since * 1000))} · ${span(Date.now() / 1000 + offset / 1000 - s.state_since)}` : "";

  $("parts").textContent = s.parts ?? "—";
  $("required").textContent = s.parts_required ? " / " + s.parts_required : "";
  const left = (s.parts_required && s.parts != null) ? Math.max(0, s.parts_required - s.parts) : null;
  $("track").hidden = !s.parts_required;
  if (s.parts_required) $("fill").style.width = Math.min(100, (s.parts || 0) / s.parts_required * 100) + "%";
  $("partsnote").textContent = left === null ? (s.parts_total ? `Total counter ${s.parts_total}` : "")
    : left > 0 ? `${left} to go` : (s.parts > s.parts_required ? `${s.parts - s.parts_required} past the count` : "Target reached");

  $("cycle").textContent = mmss(s.last_cycle_s);
  $("cyclenote").textContent = s.program?.avg_cycle_s ? "Program average " + mmss(s.program.avg_cycle_s) : "Last part";

  const pb = s.bar_changes?.per_bar;
  const nextAt = pb?.next_bar_at;
  $("nextbar").textContent = nextAt ? clock(new Date(nextAt * 1000)) : "—";
  $("barnote").textContent = nextAt && pb.left_on_bar != null ? `~${pb.left_on_bar} parts left on this bar`
    : (s.bar_changes?.today ? `${s.bar_changes.today} bar changes today` : (pb?.avg ? `~${Math.round(pb.avg)} parts a bar` : ""));

  $("program").textContent = s.program?.label || s.program?.name || "—";
  const bits = [];
  if (s.program?.stick_out) bits.push(`Stick out ${+s.program.stick_out} mm`);
  if (pb?.bars_total) bits.push(`~${pb.more_bars ?? pb.bars_total} more bars`);
  $("prognote").textContent = bits.join(" · ");

  if (s.finish_at) {
    $("infok").textContent = "Job finishes about";
    $("infov").textContent = clock(new Date(s.finish_at * 1000));
    $("infon").textContent = s.eta_s ? "in " + span(s.eta_s) : "";
  } else if (s.job_complete) {
    $("infok").textContent = "Job complete";
    $("infov").textContent = `${s.job_complete.parts} / ${s.job_complete.required}`;
    $("infon").textContent = "finished " + clock(new Date(s.job_complete.at * 1000));
  } else {
    $("infok").textContent = "Today";
    $("infov").textContent = (s.bar_changes?.today ?? 0) + " bars";
    $("infon").textContent = s.alarms_today ? `${s.alarms_today} alarm${s.alarms_today === 1 ? "" : "s"} today` : "";
  }

  // backup battery (and anything else on a schedule) once it's close or past due
  const m = (s.maintenance || []).find(x => x.state === "overdue") || (s.maintenance || []).find(x => x.state === "soon");
  $("due").hidden = !m;
  if (m) {
    const left = Math.round(m.days_left ?? 0);
    $("due").className = "due " + m.state;
    $("duetext").textContent = m.state === "overdue"
      ? `${m.name.toUpperCase()} OVERDUE BY ${Math.abs(left)} DAY${Math.abs(left) === 1 ? "" : "S"}`
      : `${m.name.toUpperCase()} DUE IN ${left} DAY${left === 1 ? "" : "S"}`;
  }

  const al = s.active_alarms || [];
  $("alarmbox").hidden = !al.length;
  $("alarmlist").innerHTML = al.slice(0, 3).map(a =>
    `<div class="a"><span class="c">${esc(a.code || a.number || "")}</span>${esc(a.message || "")}</div>`).join("");
}

// camera still, refreshed every couple of seconds - light enough to leave on a tablet all day
function camTick() {
  if (!camOn || !s?.agent_online) return;
  $("cam").src = "api/camera/frame.jpg" + amp + "t=" + Date.now();
}
function camApply() {
  $("cambox").hidden = !camOn;
  $("camtoggle").textContent = camOn ? "Hide camera" : "Camera";
  if (!camOn) $("cam").removeAttribute("src"); else camTick();
}
$("camtoggle").onclick = () => { camOn = !camOn; localStorage.setItem("wallCam", camOn ? "1" : "0"); camApply(); };
$("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
};

// keep the screen awake where the browser allows it (Chrome/Edge on a tablet or mini PC)
let lock = null;
async function keepAwake() {
  try { lock = await navigator.wakeLock?.request("screen"); } catch (e) { /* not allowed - fine */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();
camApply();
poll();
setInterval(poll, 2000);
setInterval(draw, 1000);
setInterval(camTick, 2500);
</script>
</body>
</html>
